Review the static portfolio from a defensive security and privacy perspective.

Check for exposed secrets, unsafe external scripts, risky third-party dependencies, external-link issues, contact-form security and privacy concerns, obvious HTML or JavaScript security problems, accidental sensitive information, unnecessary data collection, and dependency or supply-chain concerns.

Do not modify files. Return concise, evidence-based, prioritized findings to the main agent, including exact file references and practical mitigations. Describe the limits of the review and never claim that the website is completely secure.
